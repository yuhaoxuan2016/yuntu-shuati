<!doctype html>
<html lang="zh-CN" data-theme-color="green">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-64.png?v=0.2.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#42b883" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>小兔错题本</title>
    <!-- 标准 description：微信/QQ 这类消费者读的是它，而不是 og:
         与下面 og:description 用同一句，避免两处口径漂移（T18-2h，2026-09-17 补） -->
    <meta name="description" content="导题 刷题 考试，就用小兔错题本" />
    <!-- 社交平台分享预览卡片（Open Graph / Twitter Card）
         站点地址由构建环境变量 VITE_SITE_URL 注入（.env 提供，不进 git 仓库）：
         值 = 站点正式域名（自定义域名绑定后使用）
         注意：该变量为空或未定义时，下面三条带 URL 的标签（og:image / og:url /
         twitter:image）会在构建时被 vite.config.ts 的 shareTagFallback 整条移除，
         避免把相对路径或未替换的占位符字面量发到线上；标题/描述标签不受影响。 -->
    <meta property="og:title" content="小兔错题本" />
    <meta property="og:description" content="导题 刷题 考试，就用小兔错题本" />
    <meta property="og:image" content="%VITE_SITE_URL%/share-card.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="小兔错题本" />
    <meta name="twitter:description" content="导题 刷题 考试，就用小兔错题本" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/share-card.png" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
